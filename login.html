<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Vedji Health Partner</title>
    <!-- We use the dedicated auth-style.css to ensure index.html remains unaffected -->
    <link rel="stylesheet" href="auth-style.css">
</head>
<body class="auth-body">

    <div class="auth-wrapper">
        <aside class="auth-sidebar">
            <div class="auth-slideshow">
                <img src="https://images.unsplash.com/photo-1638202993928-7267aad84c31?auto=format&fit=crop&q=80&w=1000" alt="Clinic" class="auth-slide">
                <img src="https://images.unsplash.com/photo-1579684385127-1ef15d508118?auto=format&fit=crop&q=80&w=1000" alt="Doctor" class="auth-slide">
                <img src="https://images.unsplash.com/photo-1551076805-e1869033e561?auto=format&fit=crop&q=80&w=1000" alt="Health" class="auth-slide">
            </div>
            
            <div class="auth-sidebar-content">
                <h2>Welcome Back</h2>
                <p>Log in to manage your appointments, view medical history, and connect with your healthcare professionals instantly.</p>
            </div>
        </aside>

        <main class="auth-main">
            <div class="auth-form-container">
                <a href="index.html" class="auth-logo">Vedji.</a>
                
                <div class="auth-header">
                    <h1>Log In to Your Account</h1>
                    <p>Enter your details to securely access your portal.</p>
                </div>

                <form onsubmit="event.preventDefault(); document.getElementById('loginBtn').innerText = 'Authenticating...'; setTimeout(() => window.location.href='index.html', 1500);">
                    
                    <!-- Role Selector -->
                    <div class="auth-role-toggle">
                        <label>
                            <input type="radio" name="user_role" value="patient" checked>
                            <span>Patient</span>
                        </label>
                        <label>
                            <input type="radio" name="user_role" value="doctor">
                            <span>Doctor</span>
                        </label>
                    </div>

                    <!-- Floating Label Input: Email -->
                    <div class="auth-input-group">
                        <input type="text" id="contact" class="auth-input" placeholder=" " required>
                        <label for="contact" class="auth-label">Email or Mobile Number</label>
                    </div>

                    <!-- Floating Label Input: Password -->
                    <div class="auth-input-group">
                        <input type="password" id="password" class="auth-input" placeholder=" " required>
                        <label for="password" class="auth-label">Password</label>
                    </div>

                    <button type="submit" id="loginBtn" class="auth-btn">Sign In</button>
                </form>

                <div class="auth-links">
                    <span>Don't have an account? <a href="signup.html">Create one</a></span> <br>
                    <a href="#">Forgot Password?</a>
                </div>
            </div>
        </main>
    </div>

</body>
</html>
