<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Sign Up - Healthcare Portal</title>
    <style>
        /* बेसिक रीसेट */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* पूरा पेज 2 हिस्सों में बांटने के लिए Flexbox */
        .main-wrapper {
            display: flex;
            height: 100vh;
            width: 100%;
        }

        /* बायां हिस्सा: डॉक्टर की फोटो */
        .image-section {
            flex: 1;
            /* इंटरनेट से एक प्रोफेशनल डॉक्टर/क्लीनिक की डमी फोटो */
            background: url('https://images.unsplash.com/photo-1537368910025-7028500a263c?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80') center center / cover no-repeat;
            position: relative;
        }
        
        /* फोटो पर हल्का सा हरा शेड (ओवरले) ताकि थीम मैच करे */
        .image-section::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(5, 150, 105, 0.2); 
        }

        /* दायां हिस्सा: फॉर्म एरिया */
        .form-section {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0fdf4; /* बहुत हल्का हरा बैकग्राउंड */
        }

        /* फॉर्म कार्ड का डिज़ाइन */
        .login-container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 420px;
        }

        /* हेडिंग और टेक्स्ट - ग्रीन थीम */
        .login-container h2 {
            text-align: center;
            color: #065f46; /* डार्क ग्रीन */
            margin-bottom: 8px;
            font-size: 28px;
        }

        .login-container p {
            text-align: center;
            color: #4b5563;
            margin-bottom: 24px;
            font-size: 15px;
        }

        /* रोल सेलेक्ट (Doctor/Patient) */
        .role-selector {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 24px;
        }

        .role-selector label {
            cursor: pointer;
            color: #374151;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 6px;
            accent-color: #059669; /* रेडियो बटन का रंग हरा */
        }

        /* इनपुट फील्ड्स */
        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #374151;
            font-weight: 500;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-color: #059669; /* फोकस करने पर ग्रीन बॉर्डर */
            box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.15);
        }

        /* सबमिट बटन - ग्रीन */
        .submit-btn {
            width: 100%;
            padding: 14px;
            background-color: #059669; /* एमराल्ड ग्रीन (Emerald Green) */
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background-color: #047857; /* होवर पर थोड़ा डार्क ग्रीन */
        }

        /* फॉरगॉट पासवर्ड और साइन अप लिंक्स */
        .extra-links {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: #4b5563;
        }

        .extra-links a {
            color: #059669;
            text-decoration: none;
            font-weight: 600;
            margin-left: 5px;
        }

        .extra-links a:hover {
            text-decoration: underline;
        }

        .forgot-link {
            display: block;
            text-align: right;
            font-size: 13px;
            color: #059669;
            text-decoration: none;
            margin-top: -10px;
            margin-bottom: 20px;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        /* मोबाइल स्क्रीन के लिए (रेस्पॉन्सिव डिज़ाइन) */
        @media (max-width: 768px) {
            .main-wrapper {
                flex-direction: column;
            }
            .image-section {
                display: none; /* मोबाइल में आधी फोटो अच्छी नहीं लगती, इसलिए इसे छिपा दिया है */
            }
            .form-section {
                padding: 20px;
                background-color: #ffffff;
            }
            .login-container {
                box-shadow: none;
            }
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <!-- बायां हिस्सा: डॉक्टर की फोटो -->
        <div class="image-section"></div>

        <!-- दायां हिस्सा: लॉग-इन / साइन-अप फॉर्म -->
        <div class="form-section">
            <div class="login-container">
                <h2>Welcome to MedCare</h2>
                <p>Please log in to your account</p>

                <form onsubmit="event.preventDefault(); alert('Processing...');">
                    
                    <!-- Doctor या Patient चुनने का विकल्प -->
                    <div class="role-selector">
                        <label>
                            <input type="radio" name="user_role" value="patient" checked> Patient
                        </label>
                        <label>
                            <input type="radio" name="user_role" value="doctor"> Doctor
                        </label>
                    </div>

                    <!-- ईमेल या मोबाइल नंबर -->
                    <div class="input-group">
                        <label for="contact">Email / Mobile Number</label>
                        <input type="text" id="contact" placeholder="Enter email or mobile number" required>
                    </div>

                    <!-- पासवर्ड -->
                    <div class="input-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Enter your password" required>
                    </div>

                    <a href="#" class="forgot-link">Forgot Password?</a>

                    <button type="submit" class="submit-btn">Log In</button>
                </form>

                <!-- नया खाता बनाने (Sign Up) का लिंक -->
                <div class="extra-links">
                    Don't have an account? <a href="signup.html">Sign Up</a>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
