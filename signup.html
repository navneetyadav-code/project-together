<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Vedji Health Partner</title>
    <!-- We use the dedicated auth-style.css to ensure index.html remains unaffected -->
    <link rel="stylesheet" href="auth-style.css">
</head>
<body class="auth-body">

    <div class="auth-wrapper">
        
        <aside class="auth-sidebar">
            <div class="auth-slideshow">
                <img src="https://images.unsplash.com/photo-1551076805-e1869033e561?auto=format&fit=crop&q=80&w=1000" alt="Health" class="auth-slide">
                <img src="https://images.unsplash.com/photo-1638202993928-7267aad84c31?auto=format&fit=crop&q=80&w=1000" alt="Clinic" class="auth-slide">
                <img src="https://images.unsplash.com/photo-1579684385127-1ef15d508118?auto=format&fit=crop&q=80&w=1000" alt="Doctor" class="auth-slide">
            </div>
            
            <div class="auth-sidebar-content">
                <h2>Join Vedji Today</h2>
                <p>Create an account to easily find verified specialists, book appointments without waiting, and take control of your health journey.</p>
            </div>
        </aside>

        <main class="auth-main">
            <div class="auth-form-container">
                <a href="index.html" class="auth-logo">Vedji.</a>
                
                <div class="auth-header">
                    <h1>Create an Account</h1>
                    <p>Start your journey to better healthcare today.</p>
                </div>

                <form id="signupForm" onsubmit="handleSignup(event)">
                    
                    <div class="auth-input-group">
                        <input type="text" id="fullName" name="fullName" class="auth-input" placeholder=" " required>
                        <label for="fullName" class="auth-label">Full Name</label>
                    </div>

                    <!-- Row for DOB and Auto-Calculated Age -->
                    <div class="auth-input-group row">
                        <div>
                            <!-- Type set to text initially for placeholder, switches to date on focus -->
                            <input type="text" id="dob" name="dob" class="auth-input" placeholder=" " onfocus="(this.type='date')" onblur="if(!this.value)this.type='text'" required>
                            <label for="dob" class="auth-label">Date of Birth</label>
                        </div>
                        <div>
                            <input type="number" id="age" name="age" class="auth-input" placeholder=" " readonly required>
                            <label for="age" class="auth-label">Age (Auto)</label>
                        </div>
                    </div>

                    <!-- Row for Gender and Blood Group -->
                    <div class="auth-input-group row">
                        <div>
                            <select id="gender" name="gender" class="auth-input" required>
                                <option value="" disabled selected hidden></option>
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                                <option value="other">Other</option>
                            </select>
                            <!-- Fake placeholder hack for select to trigger floating label -->
                            <label for="gender" class="auth-label" style="top: 14px; font-size: 0.75rem; color: var(--auth-primary); font-weight:600;">Gender</label>
                        </div>
                        <div>
                            <select id="bloodGroup" name="bloodGroup" class="auth-input" required>
                                <option value="" disabled selected hidden></option>
                                <option value="A+">A+</option>
                                <option value="A-">A-</option>
                                <option value="B+">B+</option>
                                <option value="B-">B-</option>
                                <option value="O+">O+</option>
                                <option value="O-">O-</option>
                                <option value="AB+">AB+</option>
                                <option value="AB-">AB-</option>
                            </select>
                            <label for="bloodGroup" class="auth-label" style="top: 14px; font-size: 0.75rem; color: var(--auth-primary); font-weight:600;">Blood Group</label>
                        </div>
                    </div>

                    <div class="auth-input-group">
                        <input type="email" id="email" name="email" class="auth-input" placeholder=" " required>
                        <label for="email" class="auth-label">Email Address</label>
                    </div>

                    <div class="auth-input-group row">
                        <div>
                            <input type="password" id="password" name="password" class="auth-input" placeholder=" " required>
                            <label for="password" class="auth-label">Password</label>
                        </div>
                        <div>
                            <input type="password" id="confirmPassword" name="confirmPassword" class="auth-input" placeholder=" " required>
                            <label for="confirmPassword" class="auth-label">Confirm Password</label>
                            <div class="auth-error-text" id="passwordError">Passwords do not match</div>
                        </div>
                    </div>

                    <div class="auth-checkbox-group">
                        <input type="checkbox" id="terms" required>
                        <label for="terms">I agree to the <a href="#">Terms of Service</a> & <a href="#">Privacy Policy</a>.</label>
                    </div>

                    <button type="submit" id="signupBtn" class="auth-btn">Create Account</button>
                </form>

                <div class="auth-links" style="justify-content: center; margin-top: 25px;">
                    <span>Already have an account? <a href="login.html">Log in here</a></span>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Auto-calculate Age based on Date of Birth
        const dobInput = document.getElementById('dob');
        const ageInput = document.getElementById('age');

        dobInput.addEventListener('change', function() {
            if(this.value) {
                const dob = new Date(this.value);
                const today = new Date();
                let age = today.getFullYear() - dob.getFullYear();
                const m = today.getMonth() - dob.getMonth();
                
                // Adjust if birthday hasn't happened yet this year
                if (m < 0 || (m === 0 && today.getDate() < dob.getDate())) {
                    age--;
                }
                
                ageInput.value = age >= 0 ? age : 0;
                // Trigger an event so the floating label logic knows it has content
                ageInput.dispatchEvent(new Event('input'));
            } else {
                ageInput.value = '';
            }
        });

        // Validate Passwords and simulate loading on Submit
        function handleSignup(event) {
            event.preventDefault();
            
            const password = document.getElementById('password');
            const confirmPassword = document.getElementById('confirmPassword');
            const passwordError = document.getElementById('passwordError');
            const btn = document.getElementById('signupBtn');

            if (password.value !== confirmPassword.value) {
                passwordError.style.display = 'block';
                confirmPassword.style.borderColor = 'var(--auth-error)';
            } else {
                passwordError.style.display = 'none';
                confirmPassword.style.borderColor = 'var(--auth-border)';
                
                // Simulate loading state
                btn.innerText = 'Creating Account...';
                btn.style.opacity = '0.8';
                
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1500);
            }
        }

        // Remove error outline while typing
        document.getElementById('confirmPassword').addEventListener('input', function() {
            document.getElementById('passwordError').style.display = 'none';
            this.style.borderColor = 'var(--auth-primary)';
        });
    </script>

</body>
</html>
